services:
  postgresdb:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mermaid_db}
      POSTGRES_USER: ${POSTGRES_USER:-mermaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mermaid_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  websocket:
    image: mermaid-editor:local
    build:
      context: .
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4026}
    restart: unless-stopped
    command: ["node", "scripts/start-websocket-server.js"]
    environment:
      HOST: 0.0.0.0
      PORT: 4026
    ports:
      - "${WEBSOCKET_PORT:-4026}:4026"

  app:
    image: mermaid-editor:local
    build:
      context: .
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4026}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgresdb:
        condition: service_healthy
      websocket:
        condition: service_started
    command: ["sh", "-c", "pnpm db:push && pnpm start"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mermaid}:${POSTGRES_PASSWORD:-mermaid_password}@postgresdb:5432/${POSTGRES_DB:-mermaid_db}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-generate-with-openssl-rand-base64-32}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:4025}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4026}
      PORT: 4025
    ports:
      - "${APP_PORT:-4025}:4025"

volumes:
  postgres_data:
